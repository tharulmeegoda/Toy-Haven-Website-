<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Toy Haven</title>
  <meta name="description" content="Browse action figures, Funko Pops, model cars, board games and toys at Toy Haven.">
  <link rel="icon" type="image/png" href="favicon/favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="favicon/icon-192.png">
  <meta name="theme-color" content="#0b0e14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="container">
      <div class="logo">TOY HAVEN</div>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="collection.html">Collection</a>
        <a href="support.html">Support</a>
      </nav>

      <div class="header-icons">
        <a href="collection.html" aria-label="Wishlist">♡</a>
        <a href="cart.html" aria-label="Shopping cart">
          🛒
          <span id="cart-count" class="cart-count">0</span>
        </a>
        <button class="hamburger" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Products</h1>

    <!-- ============ SEARCH + FILTER BAR ============ -->
    <div class="filter-bar">
      <input
        type="text"
        id="product-search"
        class="search-input"
        placeholder="Search product name...">

      <button class="filter-pill active" data-category="All">All</button>
      <button class="filter-pill" data-category="Action Figures">Action Figures</button>
      <button class="filter-pill" data-category="Funko Pops">Funko Pops</button>
      <button class="filter-pill" data-category="Toys">Toys</button>
      <button class="filter-pill" data-category="Board Games">Board Games</button>
      <button class="filter-pill" data-category="Model Cars">Diecast Cars</button>
    </div>

    <!-- ============ PRODUCT GRID ============ -->
    <section>
      <div id="products-grid" class="product-grid">
        <!-- filled by products-page.js -->
      </div>
    </section>
  </main>

  <!-- ============ QUICK-VIEW MODAL ============ -->
  <div id="product-modal" class="modal-overlay">
    <div class="modal-box">
      <button id="product-modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="product-modal-body">
        <!-- filled by products-page.js -->
      </div>
    </div>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <h3>Toy Haven</h3>
          <p style="color: var(--text-secondary); font-size: 0.85rem;">Collectible figurines, board games, toys and diecast model cars, all in one place.</p>
        </div>
        <div>
          <h3>Explore</h3>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="support.html">Support</a></li>
          </ul>
        </div>
        <div>
          <h3>Newsletter</h3>
          <form id="newsletter-form" class="newsletter-form" novalidate>
            <label for="newsletter-email" class="sr-only" style="position:absolute; left:-9999px;">Email address</label>
            <input type="email" id="newsletter-email" placeholder="Your email address">
            <button type="submit" class="btn btn-primary">Join</button>
          </form>
          <p id="newsletter-message" class="newsletter-message"></p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Toy Haven. University project — not a real store.</p>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/shopping-cart.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products-page.js"></script>
</body>
</html>
